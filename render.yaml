services:
  - type: web
    name: lost-found
    runtime: node
    plan: free
    buildCommand: bash render-build.sh
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
